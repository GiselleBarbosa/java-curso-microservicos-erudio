version: '3.4'
services:
  zipkin:
    image: openzipkin/zipkin:2.23.2
    ports:
      - 9411:9411
    networks:
      barbosa-network:

  naming-server:
    image: gisellebarbosa/naming-server:0.0.1-SNAPSHOT
    ports:
      - "8761:8761"
    networks:
      - barbosa-network

networks:
    barbosa-network:
      driver: bridge


